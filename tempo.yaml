server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317" # 내부 통신용으로 4317

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/traces

query_frontend:
  search:
    concurrent_jobs: 1000                   # Grafana에서 검색을 위해 필수

overrides:
  metrics_generator_processors: [service-graphs, span-metrics]